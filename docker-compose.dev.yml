services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: backend-dev
    ports:
      - "${BACKEND_PORT}:3001"
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: frontend-dev
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NODE_ENV=development
      - API_URL=${API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
