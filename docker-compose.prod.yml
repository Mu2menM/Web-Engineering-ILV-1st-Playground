services:
  backend:
    build:
      context: ./backend
      target: production
    container_name: backend-prod
    ports:
      - "${BACKEND_PORT}:3001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: frontend-prod
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL}
    restart: unless-stopped
